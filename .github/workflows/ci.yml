name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner's CPU decides which ISA levels the test can exercise.
      - name: Show the CPU
        run: lscpu | sed -n '1,24p'

      - name: Build the library, run the test against every supported level, round-trip the decoder
        env:
          CC: ${{ matrix.cc }}
        run: ./build -j"$(nproc)" checks libstr

      - name: Reports
        if: always()
        run: |
          cat .build/checks/test.txt .build/checks/roundtrip.txt
          cat .build/post/report.txt
